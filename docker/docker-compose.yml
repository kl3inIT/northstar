# Northstar — one backend runtime plus the web frontend.
#
#   docker compose \
#     -f docker/docker-compose.infra.yml \
#     -f docker/docker-compose.yml \
#     --env-file .env up -d
#
# The server composes REST, MCP and background jobs in one Spring Boot process.
# Image vars are overridden by the manual deploy workflow with immutable refs.
name: northstar

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  server:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ${NORTHSTAR_SERVER_IMAGE:-northstar-server:latest}
    container_name: northstar-server
    restart: unless-stopped
    env_file: ../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Single-user wall-clock semantics for REST, MCP tools and scheduled jobs.
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      NORTHSTAR_DB_URL: jdbc:postgresql://zeromail-postgres:5432/${POSTGRES_DB:-northstar}
      NORTHSTAR_DB_USER: ${POSTGRES_USER:-northstar}
      NORTHSTAR_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    mem_limit: 2048m
    mem_reservation: 1024m
    memswap_limit: 2048m
    # Worst case: db-scheduler's two 1m waits plus Spring scheduling's 2m wait,
    # with one minute of container margin before Docker sends SIGKILL.
    stop_grace_period: 300s
    networks:
      - northstar-proxy
      - northstar-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: ${NORTHSTAR_WEB_IMAGE:-northstar-web:latest}
    container_name: northstar-web
    restart: unless-stopped
    networks:
      - northstar-proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *default-logging

networks:
  northstar-proxy:
    external: true
  northstar-internal:
    external: true
