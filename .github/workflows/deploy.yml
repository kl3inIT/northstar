# Manual deployment to the self-hosted VPS runner.
# Publishing images from main never deploys production. A human selects the Git
# revision only after CI, image build and review have completed.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit on main whose immutable full-SHA image should be deployed'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-northstar
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (self-hosted VPS runner)
    runs-on: [self-hosted, northstar]
    timeout-minutes: 25
    environment: production

    steps:
      - name: Deploy stack
        env:
          DEPLOY_REF_INPUT: ${{ inputs.ref }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          OWNER="${OWNER,,}"
          cd /apps/north-star
          mkdir -p backups
          snapshot_marker="${RUNNER_TEMP}/northstar-deploy-${GITHUB_RUN_ID}.snapshot"
          rm -f "$snapshot_marker"

          git fetch --quiet origin main
          requested_ref="${DEPLOY_REF_INPUT}"
          if [[ ! "$requested_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deploy input must be an exact 40-character lowercase commit SHA."
            exit 1
          fi
          DEPLOY_REF=$(git rev-parse --verify --end-of-options "${requested_ref}^{commit}")
          if [[ "$DEPLOY_REF" != "$requested_ref" ]]; then
            echo "::error::Deploy input did not resolve to the exact requested commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$DEPLOY_REF" origin/main; then
            echo "::error::Deploy revision must be reachable from origin/main."
            exit 1
          fi
          DEPLOY_TAG="sha-${DEPLOY_REF}"
          echo "Deploying ${DEPLOY_REF} (${DEPLOY_TAG})"

          if ! grep -Eq '^NORTHSTAR_MCP_TOKEN=.{16,}$' .env; then
            echo "::error::Set a non-empty NORTHSTAR_MCP_TOKEN in .env before deployment."
            exit 1
          fi

          echo "::group::Validate rollbackable current topology"
          has_server=0
          legacy_count=0
          if docker inspect northstar-server >/dev/null 2>&1; then
            has_server=1
          fi
          for c in northstar-api northstar-mcp northstar-worker; do
            if docker inspect "$c" >/dev/null 2>&1; then
              legacy_count=$((legacy_count + 1))
            fi
          done
          if ! docker inspect northstar-web >/dev/null 2>&1; then
            echo "::error::Current web container is missing; refusing a deployment without rollback evidence."
            exit 1
          fi
          if [[ "$has_server" -eq 1 && "$legacy_count" -ne 0 ]]; then
            echo "::error::Current backend topology is mixed; refusing deployment."
            exit 1
          fi
          if [[ "$has_server" -eq 0 && "$legacy_count" -ne 3 ]]; then
            echo "::error::Legacy backend topology is incomplete; refusing deployment."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Snapshot current topology and images"
          : > .last-deploy.txt
          for c in northstar-server northstar-api northstar-web northstar-mcp northstar-worker; do
            docker inspect --format="$c {{index .Image}}" "$c" 2>/dev/null | tee -a .last-deploy.txt || true
          done
          previous_revision=""
          for c in northstar-server northstar-api; do
            previous_revision=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$c" 2>/dev/null || true)
            [[ -n "$previous_revision" ]] && break
          done
          if [[ -n "$previous_revision" ]] && git cat-file -e "${previous_revision}^{commit}:docker/docker-compose.yml" 2>/dev/null; then
            git show "${previous_revision}:docker/docker-compose.yml" > backups/docker-compose.rollback.yml
          else
            cp docker/docker-compose.yml backups/docker-compose.rollback.yml
          fi
          cp docker/docker-compose.infra.yml backups/docker-compose.infra.rollback.yml
          touch "$snapshot_marker"
          echo "::endgroup::"

          git checkout --quiet "$DEPLOY_REF" -- docker/docker-compose.yml docker/docker-compose.infra.yml

          echo "::group::Backup database before migrate"
          docker exec zeromail-postgres pg_dump -U northstar -d northstar -Fc \
            > "backups/pre-deploy-$(date +%Y%m%d-%H%M%S).dump"
          # Names are generated from digits only, so word-splitting is impossible.
          # shellcheck disable=SC2012
          ls -t backups/pre-deploy-*.dump 2>/dev/null | tail -n +8 | xargs -r rm --
          echo "::endgroup::"

          export NORTHSTAR_SERVER_IMAGE="ghcr.io/${OWNER}/northstar-server:${DEPLOY_TAG}"
          export NORTHSTAR_WEB_IMAGE="ghcr.io/${OWNER}/northstar-web:${DEPLOY_TAG}"

          echo "::group::Pull unified release"
          docker compose -f docker/docker-compose.infra.yml -f docker/docker-compose.yml \
            --env-file .env pull server web
          for image in "$NORTHSTAR_SERVER_IMAGE" "$NORTHSTAR_WEB_IMAGE"; do
            image_revision=$(docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
            if [[ "$image_revision" != "$DEPLOY_REF" ]]; then
              echo "::error::Image provenance mismatch for $image (expected $DEPLOY_REF, got $image_revision)."
              exit 1
            fi
          done
          echo "::endgroup::"

          echo "::group::Stop legacy backend processes to prevent duplicate jobs"
          for c in northstar-api northstar-mcp northstar-worker; do
            if docker inspect "$c" >/dev/null 2>&1; then
              docker stop --time 300 "$c"
              running=$(docker inspect --format '{{.State.Running}}' "$c")
              [[ "$running" == "false" ]] || {
                echo "::error::Legacy process $c is still running; refusing unified startup."
                exit 1
              }
            fi
          done
          echo "::endgroup::"

          echo "::group::Start unified server"
          docker compose -f docker/docker-compose.infra.yml -f docker/docker-compose.yml \
            --env-file .env up -d --no-build server web
          echo "::endgroup::"

          echo "::group::Wait for server and web readiness"
          for attempt in {1..75}; do
            server_state=$(docker inspect --format '{{.State.Health.Status}}' northstar-server 2>/dev/null || echo missing)
            web_state=$(docker inspect --format '{{.State.Health.Status}}' northstar-web 2>/dev/null || echo missing)
            if [[ "$server_state" == "healthy" && "$web_state" == "healthy" ]]; then
              echo "server and web ready"
              break
            fi
            if [[ $attempt -eq 75 ]]; then
              echo "::error::readiness failed (server=$server_state web=$web_state)"
              docker compose -f docker/docker-compose.infra.yml -f docker/docker-compose.yml \
                --env-file .env logs --tail=250 server web
              exit 1
            fi
            sleep 2
          done
          echo "::endgroup::"

          echo "::group::REST authentication boundary smoke"
          docker exec northstar-server sh -c '
            set -eu
            status=$(curl -sS -o /tmp/rest-anonymous -w "%{http_code}" \
              http://localhost:8888/api/notes)
            test "$status" = "401"
            curl -fsS -D /tmp/csrf-headers -o /tmp/csrf-body \
              http://localhost:8888/api/auth/csrf
            grep -qi "set-cookie: XSRF-TOKEN=" /tmp/csrf-headers
          '
          echo "::endgroup::"

          echo "::group::MCP streamable HTTP smoke"
          docker exec northstar-server sh -c '
            set -eu
            test -n "${NORTHSTAR_MCP_TOKEN:-}"
            curl -fsS -D /tmp/mcp-headers -o /tmp/mcp-init \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -H "X-Northstar-MCP-Token: $NORTHSTAR_MCP_TOKEN" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-06-18\",\"capabilities\":{},\"clientInfo\":{\"name\":\"deploy-smoke\",\"version\":\"1\"}}}" \
              http://localhost:8888/mcp
            session=$(awk -F": " "tolower(\$1)==\"mcp-session-id\" {gsub(\"\\r\",\"\",\$2); print \$2}" /tmp/mcp-headers)
            test -n "$session"
            curl -fsS -o /dev/null \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -H "X-Northstar-MCP-Token: $NORTHSTAR_MCP_TOKEN" \
              -H "Mcp-Session-Id: $session" \
              --data "{\"jsonrpc\":\"2.0\",\"method\":\"notifications/initialized\"}" \
              http://localhost:8888/mcp
            curl -fsS -o /tmp/mcp-tools \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -H "X-Northstar-MCP-Token: $NORTHSTAR_MCP_TOKEN" \
              -H "Mcp-Session-Id: $session" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}" \
              http://localhost:8888/mcp
            grep -q "search_knowledge" /tmp/mcp-tools
            curl -fsS -o /tmp/mcp-read-only \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -H "X-Northstar-MCP-Token: $NORTHSTAR_MCP_TOKEN" \
              -H "Mcp-Session-Id: $session" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"tools/call\",\"params\":{\"name\":\"today_tasks\",\"arguments\":{}}}" \
              http://localhost:8888/mcp
            ! grep -q "isError.*true" /tmp/mcp-read-only
          '
          echo "::endgroup::"

          echo "::group::Finalize topology"
          docker rm northstar-api northstar-mcp northstar-worker 2>/dev/null || true
          # Reload only existing NPM configuration. This workflow never enables a
          # disabled Northstar route; cutover remains a separate approved action.
          docker exec nginx-proxy-manager nginx -t
          docker exec nginx-proxy-manager nginx -s reload
          rm -f "$snapshot_marker"
          echo "::endgroup::"

      - name: Roll back to previous topology on failure
        if: ${{ failure() || cancelled() }}
        run: |
          set -euo pipefail
          cd /apps/north-star || exit 1
          snapshot_marker="${RUNNER_TEMP}/northstar-deploy-${GITHUB_RUN_ID}.snapshot"
          if [[ ! -f "$snapshot_marker" || ! -s .last-deploy.txt \
              || ! -s backups/docker-compose.rollback.yml \
              || ! -s backups/docker-compose.infra.rollback.yml ]]; then
            echo "::error::Current deployment has no complete rollback snapshot; manual intervention required."
            exit 1
          fi

          prev_server=$(awk '/^northstar-server /{print $2}' .last-deploy.txt)
          prev_api=$(awk '/^northstar-api /{print $2}' .last-deploy.txt)
          prev_web=$(awk '/^northstar-web /{print $2}' .last-deploy.txt)
          prev_mcp=$(awk '/^northstar-mcp /{print $2}' .last-deploy.txt)
          prev_worker=$(awk '/^northstar-worker /{print $2}' .last-deploy.txt)
          [[ -z "$prev_web" ]] && { echo "::error::Previous web image is missing."; exit 1; }

          cp backups/docker-compose.rollback.yml docker/docker-compose.yml
          cp backups/docker-compose.infra.rollback.yml docker/docker-compose.infra.yml
          export NORTHSTAR_WEB_IMAGE="$prev_web"

          if [[ -n "$prev_server" ]]; then
            export NORTHSTAR_SERVER_IMAGE="$prev_server"
            rollback_services=(server web)
            rollback_containers=(northstar-server northstar-web)
          else
            [[ -z "$prev_api" || -z "$prev_mcp" || -z "$prev_worker" ]] \
              && { echo "::error::Legacy topology snapshot is incomplete."; exit 1; }
            docker rm -f northstar-server 2>/dev/null || true
            export NORTHSTAR_API_IMAGE="$prev_api"
            export NORTHSTAR_MCP_IMAGE="$prev_mcp"
            export NORTHSTAR_WORKER_IMAGE="$prev_worker"
            rollback_services=(api web mcp worker)
            rollback_containers=(northstar-api northstar-web northstar-mcp northstar-worker)
          fi

          echo "::warning::Deploy failed; restoring previous topology: ${rollback_services[*]}"
          docker compose -f docker/docker-compose.infra.yml -f docker/docker-compose.yml \
            --env-file .env up -d --no-build "${rollback_services[@]}"

          for attempt in {1..90}; do
            all_healthy=true
            for container in "${rollback_containers[@]}"; do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$container" 2>/dev/null || echo missing)
              if [[ "$status" != "healthy" ]]; then
                all_healthy=false
                break
              fi
            done
            if [[ "$all_healthy" == true ]]; then
              docker exec nginx-proxy-manager nginx -t
              docker exec nginx-proxy-manager nginx -s reload
              rm -f "$snapshot_marker"
              echo "Previous topology restored; deployment run remains failed for investigation."
              exit 0
            fi
            [[ $attempt -eq 90 ]] && { echo "::error::Rollback topology did not become fully healthy; restore the pre-deploy database dump if required."; exit 1; }
            sleep 2
          done
